<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本番映像 | 実況共有</title><link rel="stylesheet" href="/assets/style.css"><body class="viewer"><header><strong>本番映像</strong><span id="status">未接続</span></header><main>
<div class="screen"><video id="video" playsinline autoplay></video><div id="overlay">視聴開始を押してください。</div></div>
<div class="controls"><input id="name" maxlength="40" placeholder="表示名（実況・解説など）" aria-label="表示名"><button class="primary" id="join">視聴開始</button><button id="leave" disabled>退出</button><label>音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label><button id="full">全画面</button></div>
<p id="message" role="status">マイク・カメラの許可は不要です。</p><small id="stats"></small>
</main><script src="/assets/view.js"></script></body></html>
