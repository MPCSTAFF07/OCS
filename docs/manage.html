<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>OCS管理</title><link rel="stylesheet" href="./style.css"></head>
<body class="dock"><header><strong>OCS管理</strong><span id="badge">未接続</span></header><main>
<form id="login"><label for="relay">中継URL</label><input id="relay" type="url" value="https://mpc-official.duckdns.org/caster" required>
<label for="admin-key">管理キー</label><input id="admin-key" type="password" autocomplete="off" required>
<div class="buttons"><button class="primary" id="connect" type="submit">接続</button></div>
<small>AWS側のadmin_keyを入力してください。配信PCのOCSとOBSを起動しておきます。</small></form>
<div id="panel" hidden>
<p id="message" role="status">接続しています。</p>
<div class="buttons"><button id="start" class="primary" disabled>共有開始</button><button id="stop" disabled>停止</button></div>
<section><h2>招待URL</h2><input id="invite" readonly aria-label="実況解説への招待URL"><div class="buttons"><button id="copy" disabled>URLをコピー</button><button id="rotate" disabled>URLを更新</button></div></section>
<section><h2>接続者 <span id="count">0</span></h2><ul id="viewers"></ul></section>
<section><small id="connection"></small><div class="buttons"><button id="logout">ログアウト</button></div></section>
</div><p id="error" class="error" role="alert"></p>
</main><script src="./manage.js"></script></body></html>
